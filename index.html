<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>TerraTrio</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div id="ui">
        <button onclick="changePlanet('earth')">Earth</button>
        <button onclick="changePlanet('mars')">Mars</button>
        <button onclick="changePlanet('moon')">Moon</button>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Biblioteka Three.js i kontrola kamery (OrbitControls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="static/main.js"></script>

    <!-- Boczne menu kategorii -->
<div id="sidebar">
    <h2>Kategorie</h2>
    <ul>
        <li><a href="#" onclick="selectCategory('all')">Wszystkie obiekty</a></li>
        <li><a href="#" onclick="selectCategory('volcanoes')">Wulkany</a></li>
        <li><a href="#" onclick="selectCategory('bases')">Bazy kosmiczne</a></li>
        <li><a href="#" onclick="selectCategory('missions')">Misje Apollo / Łaziki</a></li>
    </ul>
</div>
</body>
</html>
